<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ยินดีต้อนรับ</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #13211c;
        background: #7cf7c9;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main { width: min(100%, 720px); }
      p { margin: 0 0 18px; font: 700 0.8rem ui-monospace, monospace; letter-spacing: 0.12em; }
      h1 { margin: 0; font-size: clamp(3.5rem, 14vw, 8rem); line-height: 0.9; letter-spacing: -0.07em; }
      a { display: inline-block; margin-top: 48px; color: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <p>YOUR FIRST HTML FILE</p>
      <h1>พร้อม<br />โชว์แล้ว</h1>
      <a href="../">← กลับไปหน้ารวม</a>
    </main>
  </body>
</html>
